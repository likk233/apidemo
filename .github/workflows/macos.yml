name: macOS
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test offline providers and parsers
        run: scripts/test.sh
      - name: Build Universal app
        run: scripts/build-app.sh --universal
      - uses: actions/upload-artifact@v4
        with:
          name: UsageBar-macOS
          path: dist/UsageBar-macOS.zip
